name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-environment:
    name: Build Environment
    runs-on: macos-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Check System
        run: |
          which brew || echo "brew not found"
          which git || echo "git not found"

      - name: Setup Homebrew & Various Tools
        run: |
          #/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew update
          brew install git ccache autoconf libtool automake pkg-config sassc optipng python bison flex cmake itstool gnu-sed \
                       pango cairo fontconfig harfbuzz libunwind polkit libthai xft gobject-introspection

      - name: Configure toolchain & env for Meson/JHBuild
        run: |
          # Ensure Xcode selection (no-op if path not present)
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer || true

          # Persist env for subsequent steps
          echo "CC=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++" >> $GITHUB_ENV
          # Disable ccache wrapper during configure/probe steps (it was interfering with linker probes)
          echo "CCACHE_DISABLE=1" >> $GITHUB_ENV

          # Ensure pkg-config can find Homebrew libraries
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV

          # Relax errors caused by unknown warning options when meson probes compile small test programs
          echo "CFLAGS=-Wno-error=unknown-warning-option -Wno-error=unknown-pragmas" >> $GITHUB_ENV
          echo "CXXFLAGS=-Wno-error=unknown-warning-option -Wno-error=unknown-pragmas" >> $GITHUB_ENV

      - name: Setup JHbuild
        run: |
          ln -sf $PWD/osx/jhbuildrc-custom $HOME/.jhbuildrc-custom
          /bin/bash -c "$(curl -fsSL https://gitlab.gnome.org/GNOME/gtk-osx/raw/master/gtk-osx-setup.sh)"

      # Cache downloaded sources. This shouldn't really depend on the jhbuildrc-custom
      # TODO: Figure out a better cache key for sources.
      - uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Sources
          key: ${{ hashFiles('osx/jhbuildrc-custom') }}

      - uses: actions/cache@v4
        with:
          path: |
            /Users/runner/gtk
          key: ${{ runner.os }}-${{ hashFiles('osx/jhbuildrc-custom') }}-${{ hashFiles('osx/build_env.sh') }}

      - name: Build Environment
        run: |
          echo Building in $HOME/gtk/inst
          cd osx && /bin/bash ./build_env.sh

      - name: Dump pango meson-log (diagnostic)
        if: always()
        run: |
          # If pango meson fails again, this file exists in the build log path; print it for debugging
          cat /Users/runner/.cache/jhbuild/build/pango-1.57.1/meson-logs/meson-log.txt || true

      - name: Compress Environment
        working-directory: /
        shell: 'bash'
        run: |
          tar -czf /Users/runner/work/environment.tar.gz $HOME/gtk $HOME/.new_local

      - name: Upload Environment
        uses: actions/upload-artifact@v4
        with:
          name: Environment
          path: |
            /Users/runner/work/environment.tar.gz

  build-app:
    name: Build Application
    runs-on: macos-latest
    needs: build-environment
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4

      - name: Configure toolchain & env (build-app)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer || true
          echo "CC=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++" >> $GITHUB_ENV
          echo "CCACHE_DISABLE=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
          echo "CFLAGS=-Wno-error=unknown-warning-option -Wno-error=unknown-pragmas" >> $GITHUB_ENV
          echo "CXXFLAGS=-Wno-error=unknown-warning-option -Wno-error=unknown-pragmas" >> $GITHUB_ENV

      - name: Setup JHbuild
        run: |
          ln -sf $PWD/osx/jhbuildrc-custom $HOME/.jhbuildrc-custom
          /bin/bash -c "$(curl -fsSL https://gitlab.gnome.org/GNOME/gtk-osx/raw/master/gtk-osx-setup.sh)"

      - name: Extract Environment
        working-directory: /
        shell: 'bash'
        run: |
          # Reinstall a few small tooling deps to ensure consistency
          brew update
          brew install git ccache autoconf libtool automake pkg-config sassc optipng python bison flex cmake itstool gnu-sed intltool
          pwd
          mkdir -p $HOME/Source
          tar -xzf /Users/runner/work/meld/meld/Environment/environment.tar.gz
          rm -f /Users/runner/work/meld/meld/Environment/environment.tar.gz
          ls $HOME/gtk

      - name: FIX gir
        run: |
          cd osx && /bin/bash ./fix_gir.sh

      - name: Install Icon Theme
        run: |
          alias sed=gsed
          cd osx && /bin/bash ./build_icon_theme.sh

      - name: Install GTK Theme
        run: |
          cd osx && /bin/bash ./build_gtk_theme.sh

      - name: Package
        run: |
          ~/.new_local/bin/jhbuild run osx/build_app.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: |
            osx/Archives/meldmerge.dmg
