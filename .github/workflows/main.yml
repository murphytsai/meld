name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-environment:
    name: Build Environment
    runs-on: macos-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Check System
        run: |
          which brew || echo "brew not found"
          which git || echo "git not found"

      - name: Setup Homebrew & Various Tools
        run: |
          #/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install git ccache autoconf libtool automake pkg-config sassc optipng python bison flex cmake itstool gnu-sed openssl@3

      - name: Ensure compiler env is set (for jhbuild)
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "CC=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++" >> $GITHUB_ENV
          echo "CCACHE_DISABLE=1" >> $GITHUB_ENV
          echo "JHBUILD_DISABLE_CCACHE=1" >> $GITHUB_ENV
          echo "SDKROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "CFLAGS=-isysroot ${SDKROOT}" >> $GITHUB_ENV
          echo "CXXFLAGS=-isysroot ${SDKROOT}" >> $GITHUB_ENV
          echo "LDFLAGS=-isysroot ${SDKROOT}" >> $GITHUB_ENV

      - name: Setup JHbuild
        run: |
          ln -sf $PWD/osx/jhbuildrc-custom $HOME/.jhbuildrc-custom
          /bin/bash -c "$(curl -fsSL https://gitlab.gnome.org/GNOME/gtk-osx/raw/master/gtk-osx-setup.sh)"

      # Cache downloaded sources. This shouldn't really depend on the jhbuildrc-custom
      # TODO: Figure out a better cache key for sources.
      - uses: actions/cache@v4
        with:
          path: |
            /Users/runner/Sources
          key: ${{ hashFiles('osx/jhbuildrc-custom') }}

      - uses: actions/cache@v4
        with:
          path: |
            /Users/runner/gtk
          key: ${{ runner.os }}-${{ hashFiles('osx/jhbuildrc-custom') }}-${{ hashFiles('osx/build_env.sh') }}

      - name: Setup macOS SDK paths
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          # Include system SDK paths
          export LDFLAGS="-L${SDKROOT}/usr/lib"
          export CPPFLAGS="-I${SDKROOT}/usr/include"
          # Add Homebrew OpenSSL so Python's build can find ssl
          export OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          export LDFLAGS="${LDFLAGS} -L${OPENSSL_PREFIX}/lib"
          export CPPFLAGS="${CPPFLAGS} -I${OPENSSL_PREFIX}/include"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:}$PKG_CONFIG_PATH"
          # Disable ccache wrapper during native configure/build detection to avoid
          # breaking Meson/Autotools compiler and linker detection on macOS.
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export CCACHE_DISABLE=1
          echo "SDKROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "LDFLAGS=${LDFLAGS}" >> $GITHUB_ENV
          echo "CPPFLAGS=${CPPFLAGS}" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "CC=${CC}" >> $GITHUB_ENV
          echo "CXX=${CXX}" >> $GITHUB_ENV
          echo "CCACHE_DISABLE=${CCACHE_DISABLE}" >> $GITHUB_ENV

      - name: Build Environment
        run: |
          echo Building in $HOME/gtk/inst
          cd osx && /bin/bash ./build_env.sh          

      - name: Compress Environment
        working-directory: /
        shell: 'bash'
        run: |
          tar -czf /Users/runner/work/environment.tar.gz $HOME/gtk $HOME/.new_local

      - name: Upload Environment
        uses: actions/upload-artifact@v4
        with:
          name: Environment
          path: |
            /Users/runner/work/environment.tar.gz

  build-app:
    name: Build Application
    runs-on: macos-latest
    needs: build-environment
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4

      - name: Ensure compiler env is set (for jhbuild)
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "CC=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++" >> $GITHUB_ENV
          echo "CCACHE_DISABLE=1" >> $GITHUB_ENV
          echo "JHBUILD_DISABLE_CCACHE=1" >> $GITHUB_ENV
          echo "SDKROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "CFLAGS=-isysroot ${SDKROOT}" >> $GITHUB_ENV
          echo "CXXFLAGS=-isysroot ${SDKROOT}" >> $GITHUB_ENV
          echo "LDFLAGS=-isysroot ${SDKROOT}" >> $GITHUB_ENV

      - name: Setup JHbuild
        run: |
          ln -sf $PWD/osx/jhbuildrc-custom $HOME/.jhbuildrc-custom
          /bin/bash -c "$(curl -fsSL https://gitlab.gnome.org/GNOME/gtk-osx/raw/master/gtk-osx-setup.sh)"

      - name: Extract Environment
        working-directory: /
        shell: 'bash'
        run: |
          brew install git ccache autoconf libtool automake pkg-config sassc optipng python bison flex cmake itstool gnu-sed intltool openssl@3
          pwd
          mkdir -p $HOME/Source          
          tar -xzf /Users/runner/work/meld/meld/Environment/environment.tar.gz
          rm -f /Users/runner/work/meld/meld/Environment/environment.tar.gz
          ls $HOME/gtk

      - name: Setup macOS SDK paths
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export LDFLAGS="-L${SDKROOT}/usr/lib"
          export CPPFLAGS="-I${SDKROOT}/usr/include"
          export OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          export LDFLAGS="${LDFLAGS} -L${OPENSSL_PREFIX}/lib"
          export CPPFLAGS="${CPPFLAGS} -I${OPENSSL_PREFIX}/include"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:}$PKG_CONFIG_PATH"
          # Disable ccache wrapper during native configure/build detection
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export CCACHE_DISABLE=1
          echo "SDKROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "LDFLAGS=${LDFLAGS}" >> $GITHUB_ENV
          echo "CPPFLAGS=${CPPFLAGS}" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "CC=${CC}" >> $GITHUB_ENV
          echo "CXX=${CXX}" >> $GITHUB_ENV
          echo "CCACHE_DISABLE=${CCACHE_DISABLE}" >> $GITHUB_ENV

      - name: FIX gir
        run: |
          cd osx && /bin/bash ./fix_gir.sh

      - name: Install Icon Theme
        run: |
          alias sed=gsed
          cd osx && /bin/bash ./build_icon_theme.sh

      - name: Install GTK Theme
        run: |
          cd osx && /bin/bash ./build_gtk_theme.sh

      - name: Package
        run: |
          ~/.new_local/bin/jhbuild run osx/build_app.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: |
            osx/Archives/meldmerge.dmg
